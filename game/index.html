<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Caldera Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Saira Condensed', sans-serif; color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #hud .tl { position: absolute; left: 3vw; top: 3vh; }
    #hud .tr { position: absolute; right: 3vw; top: 3vh; text-align: right; }
    #hud .br { position: absolute; right: 3vw; bottom: 4vh; text-align: right; }
    #hud .bl { position: absolute; left: 3vw; bottom: 4vh; }
    .big { font-size: clamp(34px, 6vw, 72px); font-weight: 800; line-height: .9; color: #ffc23a; }
    .lbl { font-size: clamp(14px, 1.6vw, 20px); font-weight: 600; letter-spacing: .08em; opacity: .9; }
    .time { font-size: clamp(26px, 3.6vw, 46px); font-weight: 800; color: #ffc23a; }
    #boost { width: clamp(140px, 22vw, 300px); height: 14px; background: rgba(0,0,0,.45); transform: skewX(-20deg); margin-top: 6px; }
    #boost i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffb21e, #ff5a1e); }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0908; color: #ffc23a;
      font: 800 28px 'Saira Condensed', sans-serif; letter-spacing: .1em; z-index: 5; }
    #touch { position: fixed; inset: 0; display: none; }
    #touch div { position: absolute; bottom: 5vh; width: 18vw; height: 18vw; max-width: 120px; max-height: 120px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); pointer-events: auto; }
    #msg { position: absolute; left: 0; right: 0; top: 32vh; text-align: center; font-size: clamp(40px, 8vw, 110px); font-weight: 800;
      color: #ffc23a; }
  </style>
</head>
<body>
  <div id="loading">LOADING CALDERA LOOP…</div>
  <div id="hud">
    <div class="tl"><div class="big" id="pos">LAP <span id="lap">1</span>/1</div><div class="lbl">CALDERA LOOP</div></div>
    <div class="tr"><div class="time" id="time">0:00.00</div><div class="lbl" id="best"></div></div>
    <div class="bl"><div class="lbl">BOOST <span id="heat"></span></div><div id="boost"><i id="boostbar"></i></div></div>
    <div class="br"><div class="big" id="speed">0</div><div class="lbl">KM/H</div></div>
    <div id="msg"></div>
  </div>
  <div id="touch"><div id="tl" style="left:4vw"></div><div id="tr2" style="left:26vw"></div>
    <div id="tb" style="right:26vw"></div><div id="tg" style="right:4vw"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
